<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vault — Password Manager</title>
<link rel="stylesheet" href="screens.css" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:wght@500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="popup">
    <header class="statusbar">
      <div class="brand"><span class="logo">🔒</span> Vault</div>
      <span class="ns">🔑 team/passwords</span>
      <span class="badge green">2h 14m</span>
    </header>
    <div class="modetabs">
      <div class="modetab">🗂 Secrets</div>
      <div class="modetab active">🔑 Passwords</div>
    </div>
    <div class="body">
      <div class="crumbs">password-manager / <b>you</b></div>
      <button class="secret-row"><span class="ic">🔑</span><span class="nm">github.com</span></button>
      <button class="secret-row"><span class="ic">🔑</span><span class="nm">gitlab.com</span></button>
      <button class="secret-row"><span class="ic">🔑</span><span class="nm">notion.so</span></button>
      <button class="secret-row"><span class="ic">🔑</span><span class="nm">aws.console</span></button>
    </div>
    <div class="foot">
      <button class="btn btn-primary" style="width:100%; justify-content:center;">+ Add Credential</button>
    </div>
  </div>
</body>
</html>
