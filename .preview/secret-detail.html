<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Vault — Secret detail</title>
    <link rel="stylesheet" href="screens.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="stage">
    <div class="popup-frame fixed-height">
      <div class="app-header">
        <div class="app-header-logo"><img src="logo.svg" width="26" height="26" alt="" /></div>
        <div class="app-header-title">Vault Secrets</div>
        <button class="btn-ghost-header" style="font-size: 16px; padding: 3px 8px">⚙</button>
        <button class="btn-ghost-header" style="font-size: 16px; padding: 3px 8px">🔧</button>
        <button class="btn-ghost-header" style="padding: 3px 7px; font-size: 14px; line-height: 1; margin-left: 4px">🌙</button>
      </div>

      <div class="status-bar">
        <span class="status-dot status-dot-connected"></span>
        <span class="text-sm" style="color: var(--color-success); font-weight: 500">Connected</span>
        <div class="ns-picker-wrapper">
          <span class="ns-picker-label">NS</span>
          <select class="ns-picker-select">
            <option>admin</option>
          </select>
        </div>
        <span class="ml-auto badge badge-success">TTL 2h 14m</span>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab-btn active" style="flex: 1">Secrets</button>
        <button class="tab-btn" style="flex: 1">Passwords</button>
      </div>

      <div class="mount-toolbar">
        <button class="btn btn-ghost btn-sm" style="flex-shrink: 0">← secret</button>
      </div>

      <!-- SecretDetail's own header row: path, then Retrieve / Edit / Delete / Fill -->
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: var(--border); background: var(--color-surface); flex-shrink: 0">
        <button class="btn btn-ghost btn-sm" style="flex-shrink: 0">← Back</button>
        <!-- A top-level secret: SecretDetail only renders the directory line when
             the secret is nested, and four action buttons leave very little room
             for it at 400px. -->
        <div style="flex: 1; min-width: 0">
          <div style="font-weight: 700; font-size: 13px; color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">
            grafana
          </div>
        </div>
        <button class="btn btn-sm btn-primary" style="flex-shrink: 0">Retrieve</button>
        <button class="btn btn-sm" style="display: flex; align-items: center; gap: 4px; flex-shrink: 0">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M14.5 2.5a2.121 2.121 0 0 1 3 3L6 17H3v-3L14.5 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
          Edit
        </button>
        <button class="btn btn-sm btn-danger" style="display: flex; align-items: center; gap: 4px; flex-shrink: 0">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3 6h14M8 6V4h4v2M5 6l1 11h8l1-11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Delete
        </button>
        <button class="btn btn-sm btn-primary" style="display: flex; align-items: center; gap: 4px; flex-shrink: 0">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M12.65 10A6 6 0 1 0 12 15h1l1.5 1.5 1.5-1.5 1.5 1.5 1.5-1.5L21 17l-2-2v-3.5L12.65 10zM7 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="currentColor" />
          </svg>
          Fill
        </button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" style="flex: 1">Secret Data</button>
        <button class="tab-btn" style="flex: 1">Metadata</button>
      </div>

      <div style="flex: 1; overflow-y: auto">
        <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 14px; background: var(--color-bg); border-bottom: 1px solid var(--color-border-subtle)">
          <div style="min-width: 0">
            <div class="secret-field-key">username</div>
            <div class="secret-field-value">octocat</div>
          </div>
          <div style="display: flex; gap: 2px">
            <button class="btn-icon">
              <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6" />
              </svg>
            </button>
            <button class="btn-icon">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <rect x="7" y="7" width="10" height="12" rx="2" stroke="currentColor" stroke-width="1.6" />
                <path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.6" />
              </svg>
            </button>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 14px; background: var(--color-surface); border-bottom: 1px solid var(--color-border-subtle)">
          <div style="min-width: 0">
            <div class="secret-field-key">password</div>
            <div class="secret-field-value">••••••••••••</div>
          </div>
          <div style="display: flex; gap: 2px">
            <button class="btn-icon">
              <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6" />
              </svg>
            </button>
            <button class="btn-icon">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <rect x="7" y="7" width="10" height="12" rx="2" stroke="currentColor" stroke-width="1.6" />
                <path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.6" />
              </svg>
            </button>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 14px; background: var(--color-bg); border-bottom: 1px solid var(--color-border-subtle)">
          <div style="min-width: 0">
            <div class="secret-field-key">totp_seed</div>
            <div class="secret-field-value">••••••••••••••••</div>
          </div>
          <div style="display: flex; gap: 2px">
            <button class="btn-icon">
              <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6" />
              </svg>
            </button>
            <button class="btn-icon">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <rect x="7" y="7" width="10" height="12" rx="2" stroke="currentColor" stroke-width="1.6" />
                <path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.6" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
