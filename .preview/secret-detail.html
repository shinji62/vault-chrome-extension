<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vault — Secret</title>
<link rel="stylesheet" href="screens.css" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:wght@500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="popup">
    <header class="statusbar">
      <div class="brand"><span class="logo">🔒</span> Vault</div>
      <span class="ns">NS · admin</span>
      <span class="badge green">2h 14m</span>
    </header>
    <div class="body">
      <div class="crumbs">secret<span class="sep">/</span>web<span class="sep">/</span><b>stripe/live</b></div>
      <div style="display:flex; gap:6px; margin-bottom:12px;">
        <button class="btn btn-sm btn-primary">🔓 Retrieve</button>
        <button class="btn btn-sm">✎ Edit</button>
        <button class="btn btn-sm btn-ghost">🗑 Delete</button>
      </div>
      <div class="kv">
        <div class="kv-row"><span class="k">api_key</span><span class="v">sk_live_51Hz•...</span><span class="copy">⧉</span></div>
        <div class="kv-row"><span class="k">publish</span><span class="v">pk_live_wXyZ</span><span class="copy">⧉</span></div>
        <div class="kv-row"><span class="k">mode</span><span class="v">production</span><span class="copy">⧉</span></div>
      </div>
    </div>
  </div>
</body>
</html>
