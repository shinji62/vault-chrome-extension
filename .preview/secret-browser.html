<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Vault — Secret browser</title>
    <link rel="stylesheet" href="screens.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="stage">
    <div class="popup-frame fixed-height">
      <div class="app-header">
        <div class="app-header-logo"><img src="logo.svg" width="26" height="26" alt="" /></div>
        <div class="app-header-title">Vault Secrets</div>
        <button class="btn-ghost-header" style="font-size: 16px; padding: 3px 8px">⚙</button>
        <button class="btn-ghost-header" style="font-size: 16px; padding: 3px 8px">🔧</button>
        <button class="btn-ghost-header" style="padding: 3px 7px; font-size: 14px; line-height: 1; margin-left: 4px">🌙</button>
      </div>

      <div class="status-bar">
        <span class="status-dot status-dot-connected"></span>
        <span class="text-sm" style="color: var(--color-success); font-weight: 500">Connected</span>
        <div class="ns-picker-wrapper">
          <span class="ns-picker-label">NS</span>
          <select class="ns-picker-select">
            <option>admin</option>
          </select>
        </div>
        <span class="ml-auto badge badge-success">TTL 2h 14m</span>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab-btn active" style="flex: 1">Secrets</button>
        <button class="tab-btn" style="flex: 1">Passwords</button>
      </div>

      <div class="mount-toolbar">
        <button class="btn btn-ghost btn-sm" style="flex-shrink: 0">← secret</button>
        <button class="btn btn-sm btn-primary" style="flex-shrink: 0; margin-left: auto">+ New</button>
      </div>

      <div class="breadcrumb">
        <button class="breadcrumb-link">secret</button>
        <span class="breadcrumb-sep">/</span>
        <button class="breadcrumb-link">passwords</button>
      </div>

      <div class="secret-list">
        <button class="secret-item" style="width: 100%; background: none; border: none; text-align: left; color: inherit">
          <span class="secret-item-icon">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h3.379a1.5 1.5 0 0 1 1.06.44l.583.582A1.5 1.5 0 0 0 8.582 3.5H13.5A1.5 1.5 0 0 1 15 5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12V3.5Z" fill="currentColor" />
            </svg>
          </span>
          <span class="secret-item-name">internal/</span>
          <svg class="secret-item-chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <button class="secret-item" style="width: 100%; background: none; border: none; text-align: left; color: inherit">
          <span class="secret-item-icon">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="3" y="1" width="10" height="14" rx="2" fill="currentColor" opacity="0.2" />
              <path d="M6 7h4M6 10h4M6 4h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              <circle cx="11.5" cy="11.5" r="3" fill="var(--color-bg)" stroke="currentColor" stroke-width="1.2" />
              <path d="M10.8 11.5h1.4M11.5 10.8v1.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
            </svg>
          </span>
          <span class="secret-item-name">github.com</span>
        </button>

        <button class="secret-item" style="width: 100%; background: none; border: none; text-align: left; color: inherit">
          <span class="secret-item-icon">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="3" y="1" width="10" height="14" rx="2" fill="currentColor" opacity="0.2" />
              <path d="M6 7h4M6 10h4M6 4h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              <circle cx="11.5" cy="11.5" r="3" fill="var(--color-bg)" stroke="currentColor" stroke-width="1.2" />
              <path d="M10.8 11.5h1.4M11.5 10.8v1.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
            </svg>
          </span>
          <span class="secret-item-name">gitlab.com</span>
        </button>

        <button class="secret-item" style="width: 100%; background: none; border: none; text-align: left; color: inherit">
          <span class="secret-item-icon">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="3" y="1" width="10" height="14" rx="2" fill="currentColor" opacity="0.2" />
              <path d="M6 7h4M6 10h4M6 4h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              <circle cx="11.5" cy="11.5" r="3" fill="var(--color-bg)" stroke="currentColor" stroke-width="1.2" />
              <path d="M10.8 11.5h1.4M11.5 10.8v1.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
            </svg>
          </span>
          <span class="secret-item-name">grafana</span>
        </button>

        <button class="secret-item" style="width: 100%; background: none; border: none; text-align: left; color: inherit">
          <span class="secret-item-icon">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="3" y="1" width="10" height="14" rx="2" fill="currentColor" opacity="0.2" />
              <path d="M6 7h4M6 10h4M6 4h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              <circle cx="11.5" cy="11.5" r="3" fill="var(--color-bg)" stroke="currentColor" stroke-width="1.2" />
              <path d="M10.8 11.5h1.4M11.5 10.8v1.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
            </svg>
          </span>
          <span class="secret-item-name">registry.internal</span>
        </button>
      </div>
    </div>
  </body>
</html>
