<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vault — Save to Vault</title>
<link rel="stylesheet" href="screens.css" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:wght@500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="backdrop">
    <div class="save-card">
      <div class="save-head">
        <span class="lock">🔒</span>
        <div>
          <div style="font-size:14px; font-weight:700;">Save to Vault?</div>
          <div style="font-size:12px; opacity:.85;">Keep this sign-in in your Password Manager</div>
        </div>
      </div>
      <div class="save-body">
        <div class="save-url">https://github.com</div>
        <div class="save-site">GitHub</div>
        <div class="save-row">
          <span class="lab">Username</span>
          <span class="val">octocat</span>
        </div>
        <div class="save-row">
          <span class="lab">Password</span>
          <span class="val">••••••••••••</span>
        </div>
      </div>
      <div class="save-actions">
        <button class="btn btn-primary" style="flex:1; justify-content:center;">Save password</button>
        <button class="btn" style="flex:1; justify-content:center;">Dismiss</button>
      </div>
    </div>
  </div>
</body>
</html>
