<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Vault — Auto-fill overlay</title>
    <link rel="stylesheet" href="screens.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="stage">
    <div class="webpage">
      <h2>Sign in to Example</h2>

      <label>Email</label>
      <input class="fake-input" value="octocat@example.com" readonly />

      <label>Password</label>
      <input class="fake-input" type="password" value="000000000000" readonly />

      <button class="fake-submit">Log in</button>

      <!-- Injected next to the password field by content/fillOverlay.ts -->
      <button class="vault-fill-btn stage-fill-btn" aria-label="Fill from Vault">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10.5 2a3.5 3.5 0 0 0-3.4 4.3L2.6 10.8a1 1 0 0 0-.3.7v1.9a.6.6 0 0 0 .6.6h1.9a1 1 0 0 0 .7-.3l.7-.7v-1h1v-1h1l1.1-1.1A3.5 3.5 0 1 0 10.5 2Zm1.2 3.3a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z" fill="currentColor" />
        </svg>
      </button>

      <div class="vault-dropdown open stage-dropdown">
        <div class="vault-dropdown-header">Vault Passwords</div>
        <button class="vault-dropdown-item">
          <span class="vault-dropdown-username">octocat</span>
          <span class="vault-dropdown-path">secret/passwords/example.com</span>
        </button>
        <button class="vault-dropdown-item">
          <span class="vault-dropdown-username">octocat-ci</span>
          <span class="vault-dropdown-path">secret/passwords/example-ci</span>
        </button>
      </div>
    </div>
  </body>
</html>
