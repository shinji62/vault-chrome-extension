<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vault — Mounts</title>
<link rel="stylesheet" href="screens.css" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:wght@500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="popup">
    <header class="statusbar">
      <div class="brand"><span class="logo">🔒</span> Vault</div>
      <span class="ns">NS · admin</span>
      <span class="badge green">2h 14m</span>
    </header>
    <div class="modetabs">
      <div class="modetab active">🗂 Secrets</div>
      <div class="modetab">🔑 Passwords</div>
    </div>
    <div class="body">
      <h3 style="font-size:var(--font-size-md); margin-bottom:12px;">Secret engines</h3>
      <button class="mount-item">
        <span class="ic">🗂</span>
        <span>
          <span class="name">secret</span>
          <div class="sub">KV v2 · 24 secrets</div>
        </span>
        <span class="chev">›</span>
      </button>
      <button class="mount-item">
        <span class="ic">🗂</span>
        <span>
          <span class="name">team</span>
          <div class="sub">KV v2 · 12 secrets</div>
        </span>
        <span class="chev">›</span>
      </button>
      <button class="mount-item">
        <span class="ic">🔑</span>
        <span>
          <span class="name">ssh-client</span>
          <div class="sub">SSH · coming soon</div>
        </span>
      </button>
    </div>
  </div>
</body>
</html>
